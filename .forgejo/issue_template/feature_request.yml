name: 'Feature Request'
about: 'Suggest a new feature or enhancement for miru'
title: 'Feature: <short description>'
labels:
  - 'enhancement'
body:
  - type: 'markdown'
    id: 'admonition'
    attributes:
      value: |
        Thanks for suggesting an idea for **miru**! Please describe it below so it's easy to evaluate and discuss.
      visible: ['form']
  - type: 'textarea'
    id: 'problem'
    attributes:
      label: 'Problem / motivation'
      description: 'Is this request related to a problem? Describe what you''re trying to do that isn''t currently possible or is awkward.'
      placeholder: 'e.g. I find it hard to ... when ...'
    validations:
      required: true
  - type: 'textarea'
    id: 'proposed_solution'
    attributes:
      label: 'Proposed solution'
      description: 'Describe the feature or change you''d like to see'
      placeholder: ''
    validations:
      required: true
  - type: 'textarea'
    id: 'alternatives'
    attributes:
      label: 'Alternatives considered'
      description: 'Any alternative solutions, workarounds, or existing tools you''ve tried'
      placeholder: ''
    validations:
      required: false
  - type: 'checkboxes'
    id: 'contribution'
    attributes:
      label: 'Are you willing to help implement this?'
      options:
        - label: 'Yes, I''d like to work on this'
  - type: 'textarea'
    id: 'notes'
    attributes:
      label: 'Additional context'
      description: 'Mockups, examples from other tools, links, etc.'
    validations:
      required: false
