version = "2"

[sigil.clean]
silent = true
description = "Remove build artifacts"
language = "shell"
run = "rm -rf build/ build-asan build-valgrind/ build-analyzer/"

[sigil.build]
silent = true
description = "Build miru"
language = "shell"
run = '''
cmake -S . -B build -G "Unix Makefiles" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_INSTALL_PREFIX=~/.local
cmake --build build
'''

[sigil.install]
depends = ["build"] 
silent = true
description = "Install miru binaries to ~/.local/bin"
language = "shell"
run = "cmake --install build"

[sigil.run-daemon]
silent = true
description = "Run miru-daemon locally"
language = "shell"
run = "./build/miru-daemon"

[sigil.sanitize]
silent = true
description = "Memory-safety checks; ASan + UBSan and GCC static analyzer"
language = "shell"
run = "bash scripts/sanitize.sh check"

[sigil.asan]
silent = true
description = "Build with ASan + UBSan and run the smoke tests"
language = "shell"
run = "bash scripts/sanitize.sh asan"

[sigil.analyze]
silent = true
description = "Build with GCC -fanalyzer and report findings"
language = "shell"
run = "bash scripts/sanitize.sh analyzer"

[sigil.valgrind]
silent = true
description = "Run the smoke tests under Valgrind Memcheck"
language = "shell"
run = "bash scripts/sanitize.sh valgrind"

[sigil.sanitize-all]
silent = true
description = "Run every Memory-safety check (ASan, UBSan, GCC analyzer, Valgrind)"
language = "shell"
run = "bash scripts/sanitize.sh all"
