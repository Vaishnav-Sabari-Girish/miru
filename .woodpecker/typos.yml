when:
  - event: push
    branch: main
  - event: pull_request

steps:
  typos-check:
    image: debian:bookworm-slim
    commands:
      - apt-get update -qq && apt-get install -y -qq curl ca-certificates
      - |
        TYPOS_VERSION="1.47.2"
        curl -LsSf "https://github.com/crate-ci/typos/releases/download/v${TYPOS_VERSION}/typos-v${TYPOS_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | tar xz -C /usr/local/bin typos
      - typos
