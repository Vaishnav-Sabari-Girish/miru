clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      tags: true
      depth: 0   # full history for git-cliff / git describe

when:
  - event: tag
    ref: refs/tags/v*

steps:
  build:
    image: ubuntu:24.04
    commands:
      - apt-get update
      - apt-get install -y build-essential cmake ninja-build pkg-config libwayland-dev wayland-protocols libegl1-mesa-dev
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build build
      - ./build/miru-daemon --version
      - file build/miructl

  package:
    image: ubuntu:24.04
    commands:
      - version="${CI_COMMIT_TAG}"
      - pkg_dir="miru-${version}-linux-x86_64"
      - mkdir -p "${pkg_dir}"
      - cp build/miru-daemon build/miructl "${pkg_dir}/"
      - cp README.md LICENSE "${pkg_dir}/"
      - tar czf "${pkg_dir}.tar.gz" "${pkg_dir}"
      - sha256sum "${pkg_dir}.tar.gz" > "${pkg_dir}.tar.gz.sha256"

  changelog:
    image: orhunp/git-cliff:latest
    commands:
      - git-cliff --config cliff.toml --latest --strip header --output CHANGELOG_RELEASE.md

  publish-release:
    image: woodpeckerci/plugin-release
    when:
      - evaluate: '!contains(CI_COMMIT_TAG, "-")'
    settings:
      api_key:
        from_secret: woodpecker-release 
      files:
        - "miru-*.tar.gz"
        - "miru-*.tar.gz.sha256"
      title: "Miru ${CI_COMMIT_TAG}"
      note: CHANGELOG_RELEASE.md
      prerelease: false

  publish-prerelease:
    image: woodpeckerci/plugin-release
    when:
      - evaluate: 'contains(CI_COMMIT_TAG, "-")'
    settings:
      api_key:
        from_secret: codeberg_token
      files:
        - "miru-*.tar.gz"
        - "miru-*.tar.gz.sha256"
      title: "Miru ${CI_COMMIT_TAG}"
      note: CHANGELOG_RELEASE.md
      prerelease: true
